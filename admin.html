<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Val Specialism Payments</title><style>body{font-family:system-ui;background:#f4f7fb;color:#172033;margin:0;padding:28px}main{max-width:1200px;margin:auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px}h1{margin-top:0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#0f766e;color:#fff}.paid{font-weight:800;color:#0f766e}.pending{color:#b45309}.failed,.refunded{color:#b91c1c}.muted{color:#64748b}</style></head><body><main><h1>Val Specialism — Payments</h1><p class="muted">Automatically updated from verified PayPal payments.</p><div id="status">Loading…</div><div id="free" class="muted" style="margin:10px 0;font-weight:700">Free reviews used: —</div><table><thead><tr><th>Customer</th><th>Email</th><th>Validation</th><th>Amount</th><th>Status</th><th>Paid at</th></tr></thead><tbody id="rows"></tbody></table></main><script>async function load(){const r=await fetch('/api/admin/payments');const d=await r.json();if(!r.ok){document.getElementById('status').textContent=d.error||'Access denied';return}document.getElementById('status').textContent=d.rows.length+' payment records';document.getElementById('free').textContent='Free reviews used: '+(d.freeReviews||0);document.getElementById('rows').innerHTML=d.rows.map(x=>`<tr><td>${x.name||''}</td><td>${x.email}</td><td>${x.validation_id}</td><td>${x.currency} ${x.amount}</td><td class="${String(x.status).toLowerCase()}">${x.status}</td><td>${x.paid_at||'—'}</td></tr>`).join('')}load();setInterval(load,5000);</script></body></html>
